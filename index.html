<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ressources pédagogiques M1 Génie Civil — Structures.">
  <meta name="theme-color" content="#f5f8fa">
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=20261006-deeper-blue">
  <title>M1 • GC — Ressources pédagogiques</title>
  <script>
    (() => {
      let theme = 'light';
      try {
        theme = localStorage.getItem('m1gc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
      --font-sans: "Aptos", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      --color-ink: #142535;
      --color-accent: #1f4f70;
      --color-paper: #f5f8fa;
    }
  </style>
  <style>
    :root { color-scheme: light; }
    :root.dark { color-scheme: dark; }
    html { scroll-behavior: smooth; }
    body { min-width: 320px; }
    button, a { -webkit-tap-highlight-color: transparent; }
    #brand-title-link, #brand-title-link:visited { color: #142535; }
    #brand-title-link:hover, #brand-title-link:focus-visible { color: #1f4f70; }
    :root.dark #brand-title-link, :root.dark #brand-title-link:visited { color: #fff; }
    :root.dark #brand-title-link:hover, :root.dark #brand-title-link:focus-visible { color: #83b6d6; }
    :focus-visible { outline: 3px solid #1f4f70; outline-offset: 3px; }
    .hero-blueprint::after {
      content: "";
      position: absolute;
      inset: 0 0 0 auto;
      width: 52%;
      background-image: linear-gradient(rgba(31,79,112,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(31,79,112,.045) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(90deg, transparent, #000 25%);
      pointer-events: none;
    }
    :root.dark .hero-blueprint::after {
      background-image: linear-gradient(rgba(131,182,214,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(131,182,214,.075) 1px, transparent 1px);
    }
    .module-icon-wrap {
      box-sizing: border-box;
      display: flex;
      flex: 0 0 3rem;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(31,79,112,.24);
      border-radius: .75rem;
      background: linear-gradient(135deg, rgba(31,79,112,.14) 0%, rgba(31,79,112,.06) 100%);
      background-size: 100% 100%;
      color: #173f5d;
      transition: background .2s ease, border-color .2s ease;
    }
    .module-icon-wrap svg { display: block; width: 100%; height: 100%; }
    .group:hover .module-icon-wrap, .group:focus-visible .module-icon-wrap {
      border-color: rgba(31,79,112,.38);
      background: linear-gradient(135deg, rgba(31,79,112,.19) 0%, rgba(31,79,112,.09) 100%);
      background-size: 100% 100%;
    }
    :root.dark .module-icon-wrap {
      border-color: rgba(131,182,214,.28);
      background: linear-gradient(135deg, rgba(131,182,214,.18) 0%, rgba(131,182,214,.08) 100%);
      background-size: 100% 100%;
      color: #bfdef0;
    }
    :root.dark .group:hover .module-icon-wrap, :root.dark .group:focus-visible .module-icon-wrap {
      border-color: rgba(131,182,214,.44);
      background: linear-gradient(135deg, rgba(131,182,214,.24) 0%, rgba(131,182,214,.12) 100%);
      background-size: 100% 100%;
    }
    #browse-section { scroll-margin-top: 1rem; }
    .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body class="bg-paper font-sans text-slate-800 antialiased transition-colors duration-200 dark:bg-[#0b1520] dark:text-slate-100">
  <div class="min-h-screen flex flex-col">
    <header class="border-b border-slate-200/80 bg-[#f5f8fa] dark:border-white/10 dark:bg-[#0b1520]">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 py-3 sm:flex-nowrap sm:px-6 sm:py-3.5 lg:px-8">
        <div class="flex min-w-0 items-center gap-2.5 rounded-lg">
          <a href="#" id="home-link" class="shrink-0 rounded-lg" aria-label="M1 GC, accueil">
            <img src="logo.svg?v=20261006-deeper-blue" alt="" class="h-14 w-14" aria-hidden="true">
          </a>
          <span class="min-w-0">
            <span class="block truncate text-sm font-semibold tracking-tight"><a id="brand-title-link" href="https://frahchaouche-mohammedhadi.github.io/Master1-GC/#" class="rounded-sm transition-colors focus-visible:outline-none">Génie Civil —&nbsp;UDBKM</a></span>
            <span class="flex min-w-0 items-center gap-1 text-[11px] text-slate-500 dark:text-slate-400"><svg class="h-2.5 w-2.5 shrink-0 text-[#1f4f70] dark:text-sky-300" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 7.5 4.5 12 6 7.5 7.5 6 12 4.5 7.5 0 6l4.5-1.5z" fill="currentColor"/></svg><span class="truncate">Conçu par Mohammed Hadi</span></span>
          </span>
        </div>
        <div class="order-2 flex shrink-0 items-center gap-2.5 sm:order-3">
          <span class="hidden text-[11px] font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400 sm:block">Affichage</span>
          <button id="theme-toggle" type="button" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-50 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:hover:bg-white/10" aria-label="Activer le thème sombre" title="Changer de thème">
            <span id="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
        <nav class="order-3 flex w-full rounded-xl border border-slate-200 bg-[#e9f0f4] p-1 sm:order-2 sm:w-auto dark:border-white/10 dark:bg-white/5" aria-label="Choisir le semestre" role="group">
          <button class="semester-button min-h-10 flex-1 rounded-lg px-5 py-2 text-sm font-semibold transition sm:flex-none" data-semester="S1" aria-pressed="true">S1</button>
          <button class="semester-button min-h-10 flex-1 rounded-lg px-5 py-2 text-sm font-semibold transition sm:flex-none" data-semester="S2" aria-pressed="false">S2</button>
        </nav>
      </div>
    </header>

    <main class="mx-auto w-full max-w-7xl flex-1 px-4 pb-10 pt-5 sm:px-6 sm:py-9 lg:px-8">
      <section class="hero-blueprint relative overflow-hidden rounded-2xl border border-[#d5e1e7] bg-[#e9f0f4] px-5 py-6 dark:border-white/10 dark:bg-[#182a3a] sm:rounded-3xl sm:px-8 sm:py-8 lg:px-10 lg:py-9" aria-labelledby="hero-title">
        <svg class="pointer-events-none absolute right-10 top-1/2 hidden h-48 w-64 -translate-y-1/2 text-[#1f4f70] opacity-[.10] dark:text-[#83b6d6] dark:opacity-[.13] lg:block" viewBox="0 0 256 192" fill="none" aria-hidden="true">
          <path d="M30 176V32h196v144M30 80h196M30 128h196M80 32v144m48-144v144m48-144v144" stroke="currentColor" stroke-width="2"/>
          <path d="m30 80 50 48m0-48-50 48m98-48 48 48m0-48-48 48m48 0 48 48m-48-48 48-48" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 176h216M20 32h216" stroke="currentColor" stroke-width="3"/>
        </svg>
        <div class="relative z-10 max-w-3xl">
        <p class="mb-2 flex items-center gap-2 font-sans text-[11px] font-semibold uppercase tracking-[.15em] text-[#1f4f70] dark:text-sky-300"><span class="h-px w-6 bg-current"></span> Espace Etudiant</p>
        <h1 id="hero-title" class="max-w-2xl font-sans text-[1.8rem] font-bold leading-[1.12] tracking-tight text-slate-900 dark:text-white sm:text-3xl lg:text-4xl">Master 1 — Structures</h1>
        <p class="mt-2 text-xl font-semibold leading-tight text-[#1f4f70] dark:text-sky-300 sm:text-2xl">Génie Civil</p>
        <p class="mt-2 text-sm font-medium leading-6 text-slate-600 dark:text-slate-300 sm:text-base">Cours, TD, TP et Examens au même endroit.</p>
        <div class="mt-4 inline-flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300">
          <span class="h-2 w-2 rounded-full bg-[#1f4f70] dark:bg-sky-300"></span><span id="semester-caption">Semestre 1</span><span aria-hidden="true" class="text-slate-400">·</span><span id="module-count">9 modules</span>
        </div>
        </div>
      </section>

      <section id="browse-section" class="mt-7 sm:mt-9" aria-labelledby="content-heading">
        <div class="mb-4 flex min-h-12 flex-wrap items-center justify-between gap-3 sm:mb-5">
          <div>
            <p id="breadcrumb" class="mb-1 hidden text-[11px] font-medium text-slate-500 dark:text-slate-400" aria-live="polite"></p>
            <h2 id="content-heading" tabindex="-1" class="text-lg font-semibold tracking-tight text-slate-900 outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#1f4f70] dark:text-white sm:text-xl">Modules du semestre</h2>
          </div>
          <button id="back-button" type="button" style="display:none" class="min-h-10 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-white/10 dark:bg-white/5 dark:text-slate-200 dark:hover:bg-white/10">
            <span aria-hidden="true">←</span> Retour aux modules
          </button>
        </div>
        <div id="content" class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 xl:grid-cols-3" aria-live="polite"></div>
      </section>
    </main>

    <footer class="safe-bottom border-t border-slate-200/80 dark:border-white/10">
      <div class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-3 px-4 py-5 text-[11px] text-slate-500 dark:text-slate-400 sm:flex-row sm:items-center sm:px-6 lg:px-8">
        <span>© 2026 Tous droits réservés.</span>
        <span class="inline-flex items-center gap-2.5 font-medium tracking-wide text-slate-600 dark:text-slate-300">
          <svg class="h-5 w-5 shrink-0 text-[#1f4f70] dark:text-sky-300" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 3v4h4M15 3v4h-4M3 15v-4h4M15 15v-4h-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.5" fill="#83b6d6"/></svg>
          <span>Conçu &amp; réalisé par <span class="font-semibold text-slate-800 dark:text-white">Mohammed Hadi</span></span>
        </span>
      </div>
    </footer>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
